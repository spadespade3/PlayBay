name: Deploy PlayBay preview to GitHub Pages

on:
  push:
    branches:
      - feature/console-home-red-pixel
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        run: npm run check
      - name: Run regression tests
        run: npm test
      - name: Configure GitHub Pages (optional preview deployment)
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Upload static site
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy preview
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
